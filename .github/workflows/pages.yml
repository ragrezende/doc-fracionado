name: Publicar no GitHub Pages

# Publica a cada push no main (isto é, a cada merge de PR) e permite disparo manual.
# Não publica por tag: o ambiente `github-pages` só aceita deploys do main, e uma tag seria recusada.
# Detalhes em docs/LANCAMENTO.md.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.implantacao.outputs.page_url }}
    steps:
      - id: implantacao
        uses: actions/deploy-pages@v4
